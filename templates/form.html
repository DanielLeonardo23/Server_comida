<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Clasificador de Comidas Peruanas</title>
</head>
<body>
    <h1>🍽️ Clasificador de Comidas Peruanas</h1>
    <p>Sube una imagen de un plato y te mostraré la categoría detectada y los platos específicos con su información nutricional.</p>

    <form method="POST" enctype="multipart/form-data">
        <input type="file" name="image" accept="image/*" required>
        <button type="submit">Enviar</button>
    </form>
</body>
</html>
